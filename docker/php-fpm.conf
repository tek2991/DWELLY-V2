[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
user = www-data
group = www-data
listen = 9000
listen.backlog = 511

; Ondemand process manager calibrated for 200 concurrent connections
; Spawns up to 25 worker processes under peak load; terminates idle workers after 30s
pm = ondemand
pm.max_children = 25
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Pass environment variables through to worker processes
clear_env = no

; Log output redirection to stdout/stderr for Docker log collectors
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; Calibrated for 20MB file uploads with multipart overhead margin
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 30M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_value[max_input_time] = 120
